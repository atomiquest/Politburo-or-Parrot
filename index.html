<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Politburo or Parrot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Underdog&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D polar-station room behind everything; console HUD on top; case-file column on the left (stacks under the desk view on phones); stamp bar under the desk view */
:root{
  --night:#0c1117; --console:#1b2127; --console-hi:#2c343c; --well:#090c10;
  --paper:#e4d9b7; --paper-2:#d4c596; --manila:#c39a57; --label:#efe5c8;
  --ink:#2a2219; --ink-soft:#64553f;
  --red:#b0261c; --meat:#8a1832; --green:#2e6b39; --amber:#e9b24a; --frost:#dce6ee; --muted:#8e9aa4;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"VT323","Courier New",monospace;
  --fs-1:18px; --fs-2:21px; --fs-3:26px; --lh:1.1;
  color-scheme:dark;
}
html[lang|="ru"]{--f-body:"Underdog","Courier New",monospace;--fs-1:13px;--fs-2:15.5px;--fs-3:19px;--lh:1.35}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--frost);font-family:var(--f-body);font-size:var(--fs-2);line-height:var(--lh);overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#gl{position:fixed;inset:0;z-index:0}
#gl canvas{display:block;width:100%!important;height:100%!important;touch-action:manipulation}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.6))}
.vig.alarm{animation:alarm 1s steps(2) infinite}
@keyframes alarm{50%{background:radial-gradient(120% 90% at 50% 45%,rgba(176,38,28,.06) 35%,rgba(176,38,28,.55))}}

.ui{position:fixed;inset:0;z-index:2;display:grid;gap:10px;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(140px,1fr) auto auto;
  grid-template-areas:"hud" "stage" "files" "act"}
.ui>*{min-width:0}
.hud,.files,.act,.card,.skip{pointer-events:auto}
@media (min-width:880px){
  .ui{grid-template-columns:minmax(270px,330px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud hud" "files stage" "files act"}
}
.ui.is-title{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud" "stage"}
.ui.is-title .files,.ui.is-title .act,.ui.is-title .hud-game{display:none}

/* HUD: the station console */
.hud{grid-area:hud;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:6px 10px;background:linear-gradient(var(--console-hi),var(--console));border:3px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.07),inset -3px -3px 0 rgba(0,0,0,.45),0 4px 0 #000}
.brand{font-family:var(--f-display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--red);font-weight:400}
.hud-game{display:flex;align-items:center;gap:12px;flex:1 1 250px;min-width:0}
.day{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:var(--fs-1);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.flip{display:inline-block;padding:1px 6px;background:var(--well);color:var(--amber);font-family:"VT323",monospace;font-size:28px;line-height:1;border:2px solid #000;font-variant-numeric:tabular-nums}
.flip.go{animation:flip .45s steps(5)}
@keyframes flip{50%{transform:perspective(160px) rotateX(88deg)}}
.timer{flex:1;min-width:70px;display:flex;align-items:center;gap:8px}
.fuse{flex:1;height:12px;background:var(--well);border:2px solid #000;position:relative;overflow:hidden}
.fuse i{position:absolute;left:0;top:0;bottom:0;width:100%;background:repeating-linear-gradient(90deg,var(--amber) 0 6px,#c98f2c 6px 8px)}
.fuse.low i{background:var(--red);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.secs{font-family:"VT323",monospace;font-size:26px;color:var(--amber);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.tins{display:flex;align-items:center;gap:5px;font-family:"VT323",monospace;font-size:24px}
.tin-ico{display:block;height:19px;width:auto;filter:drop-shadow(1px 1px 0 #000)}
.tins.pop{animation:pop .5s steps(4)}
@keyframes pop{50%{transform:scale(1.4)}}
.hbtns{display:flex;gap:8px;margin-left:auto}
.hbtn{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;background:var(--well);border:2px solid #000;padding:6px 9px;cursor:pointer;box-shadow:inset 2px 2px 0 rgba(255,255,255,.08),0 3px 0 #000;white-space:nowrap}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.hbtn .on{color:var(--amber)}.hbtn .off{color:var(--muted)}

/* Case file + rulebook */
.files{grid-area:files;display:flex;flex-direction:column;gap:12px;min-height:0;max-height:34vh;overflow:auto;padding:2px 8px 10px 2px;scrollbar-width:thin}
.tabs{display:flex;gap:8px;flex:none}
.tab{flex:1;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:7px 8px;background:var(--console);border:2px solid #000;cursor:pointer;box-shadow:0 3px 0 #000}
.tab[aria-selected="true"]{background:var(--manila);color:var(--ink)}
.sheet{color:var(--ink);border:3px solid #000;box-shadow:5px 5px 0 rgba(0,0,0,.55);padding:12px 14px 14px;transform:rotate(var(--rot,0deg));flex:none}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.dossier{--rot:-.5deg;background:linear-gradient(var(--manila),#b98f4d)}
.dossier .lbl{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;background:var(--label);border:2px solid var(--ink);padding:4px 10px;margin-bottom:10px}
.dossier .lbl small{font-size:var(--fs-1);color:var(--ink-soft)}
.kv{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px 12px}
.kv li{display:flex;flex-direction:column;min-width:0;padding:2px 5px;margin:-2px -5px}
.kv li.hint{background:rgba(255,226,140,.7);box-shadow:inset 0 -3px 0 rgba(56,58,68,.55);animation:hintIn .6s steps(3) both}
@keyframes hintIn{0%{background:transparent}50%{background:rgba(255,226,140,1)}}
.tab.has-hint::after{content:"";display:inline-block;width:7px;height:7px;margin-left:7px;background:var(--amber);border:1px solid #000;vertical-align:1px}
.kv .k{font-family:var(--f-display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.kv .v{font-size:var(--fs-2);line-height:1.05;overflow-wrap:anywhere}
html[lang|="ru"] .kv .v{line-height:1.25}
.rules{--rot:.4deg;background:var(--paper-2);padding-top:0}
.rules h2{margin:0 -14px 8px;padding:6px 14px;background:var(--red);color:var(--label);border-bottom:3px solid #000}
.rules .upd{margin:0 0 8px;font-size:var(--fs-1);color:var(--ink-soft)}
.rules ol{list-style:none;margin:0;padding:0;display:grid;gap:7px;counter-reset:art}
.rules li{counter-increment:art;position:relative;padding-left:2.3em}
.rules li::before{content:"§" counter(art);position:absolute;left:0;top:.1em;font-family:var(--f-display);font-size:13px;color:var(--red)}
.rules li.new{animation:newrule 1.4s steps(7)}
.rules .tag{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;background:var(--red);color:var(--label);padding:1px 5px;margin-left:6px;vertical-align:middle}
@keyframes newrule{0%,30%,60%{background:rgba(176,38,28,.28)}15%,45%,100%{background:transparent}}
@media (max-width:879px){.sheet{display:none;transform:none}.sheet.on{display:block}}
@media (max-width:879px){.ui.has-card{grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud" "stage"}.ui.has-card .files,.ui.has-card .act{display:none}}
@media (min-width:880px){.files{max-height:none}.tabs{display:none}}

/* Stage: the desk view the camera frames */
.stage{grid-area:stage;position:relative;min-height:0}
.caption{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px;pointer-events:none}
.caption .d{font-family:var(--f-display);font-size:clamp(36px,8vw,72px);letter-spacing:.14em;text-transform:uppercase;color:var(--frost);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.7)}
.caption .t{font-size:var(--fs-3);color:var(--amber);text-shadow:0 2px 0 #000}
.caption .h{font-size:var(--fs-2);color:#f0a8a0;text-shadow:0 2px 0 #000}
.caption.show{animation:cap 1.9s ease both}
@keyframes cap{0%{opacity:0;transform:translateY(14px)}15%,78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
.skip{position:absolute;right:0;bottom:0;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:rgba(9,12,16,.85);border:2px solid #000;padding:8px 11px;cursor:pointer}
.card{position:absolute;left:50%;top:50%;width:min(540px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,.6);padding:20px 22px 22px;transform:translate(-50%,-50%);animation:cardIn .65s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,-50%) perspective(900px) rotateX(62deg) translateY(70px) scale(.92)}}
.card .eyebrow{margin:0 0 8px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.card h1{margin:0 0 12px;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,44px);line-height:1.02;text-transform:uppercase;text-wrap:balance}
.card h1 span{color:var(--red)}
.card h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:32px;letter-spacing:.06em;text-transform:uppercase}
.card h2.ok{color:var(--green)}.card h2.bad{color:var(--red)}
.card p{margin:0 0 10px}
.card .tell{border:2px dashed var(--ink-soft);padding:8px 10px;margin:0 0 12px;background:rgba(255,255,255,.28)}
.card .tell b{display:block;font-family:var(--f-display);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.card .verdict{font-size:var(--fs-3)}.card .verdict b{color:var(--red);font-weight:400}
.card .dim{color:var(--ink-soft)}
.card .reward{display:flex;align-items:center;gap:12px;margin:0 0 4px}.card .reward p{margin:0}
.card .reward img,.card .haul img{display:block;height:58px;width:auto;flex:none;filter:drop-shadow(2px 2px 0 rgba(42,34,25,.35))}
.card .pick{margin:14px 0 7px}
.shifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shift{position:relative;display:grid;justify-items:center;padding:8px 4px 9px;background:var(--paper-2);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(42,34,25,.45);cursor:pointer;transition:transform .08s,box-shadow .08s}
.shift b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.shift span{font-size:var(--fs-1);line-height:1.15}
.shift i{margin-top:4px;padding:2px 6px;font-style:normal;font-family:var(--f-display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.shift.s7 i,.lvl.easy{background:var(--green)}.shift.s10 i,.lvl.medium{background:#94660f}.shift.s14 i,.lvl.hard{background:var(--red)}
.shift[aria-checked="true"]{background:var(--ink);color:var(--label);box-shadow:0 3px 0 #000;transform:translateY(-2px)}
.shift em{position:absolute;top:-9px;right:-6px;padding:1px 4px;font-style:normal;font-family:var(--f-display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:var(--paper);border:2px solid var(--green);transform:rotate(7deg)}
.card .note{margin:9px 0 0;color:var(--ink-soft)}
.btn2{display:block;margin:10px auto 0;padding:6px 10px;background:none;border:0;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.permit{position:relative;margin:4px 0 12px;padding:10px 12px;border:2px solid var(--ink);background:repeating-linear-gradient(45deg,rgba(42,34,25,.05) 0 6px,transparent 6px 12px),var(--label)}
.permit .ph{display:block;margin-bottom:4px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.permit p{margin:0;padding-right:92px}
.permit .pst{position:absolute;right:10px;top:50%;padding:3px 6px;font-family:var(--f-display);font-size:13px;letter-spacing:.08em;color:var(--green);border:3px solid var(--green);transform:translateY(-50%) rotate(-10deg);opacity:.85;animation:pstamp .45s cubic-bezier(.3,1.6,.5,1) .6s both}
@keyframes pstamp{from{opacity:0;transform:translateY(-50%) rotate(-10deg) scale(2.4)}}
.permit.no .pst{color:var(--red);border-color:var(--red)}
/* Volkov's evening: his cards sit low so the aurora shows above them */
.card.low{top:auto;bottom:0;transform:translateX(-50%);animation-name:cardInLow}
@keyframes cardInLow{from{opacity:0;transform:translateX(-50%) perspective(900px) rotateX(62deg) translateY(70px) scale(.92)}}
.vk{margin:0 0 4px}.vk::after{content:"";display:block;clear:both}.vk p{margin:0 0 8px}
.vk-ph{float:left;margin:2px 14px 6px 0}
.vk-ph img,.vk-ph canvas{display:block;width:132px;height:176px;image-rendering:pixelated;border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(42,34,25,.35);background:#20291f}
.vk-ph figcaption{max-width:138px;margin-top:6px;font-family:var(--f-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--ink-soft)}
.vk-ph.cold img{filter:grayscale(.7) contrast(1.15) brightness(.9)}
.vk .w{visibility:hidden}.vk .w.on{visibility:visible}.vk.talking{cursor:pointer}.vk-btns.wait{visibility:hidden}
.vk-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.alt{background:var(--paper-2);color:var(--ink);box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),0 5px 0 #000}
@media (max-width:420px){.vk-btns{grid-template-columns:1fr;gap:0}}
.night{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#04060a;opacity:0;transition:opacity .9s ease;text-align:center;pointer-events:none}
.night.on{opacity:1}
.night .n1{margin:0 0 10px;font-family:var(--f-display);font-size:clamp(22px,4.4vw,38px);letter-spacing:.06em;color:var(--frost);text-wrap:balance}
.night .n2{margin:0;font-size:var(--fs-3);color:var(--muted)}
.glare{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at var(--gx,25%) var(--gy,35%),rgba(255,238,200,.85),rgba(255,226,170,.25) 14%,rgba(255,226,170,0) 34%)}
.files .kv .v,.files .rules li{text-shadow:calc(var(--hang,0)*4px) calc(var(--hang,0)*1px) 0 rgba(42,34,25,calc(var(--hang,0)*.5))}
.hangt{margin-left:4px;padding:2px 5px;font-family:var(--f-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--amber)}
@media (max-width:520px){.hangt{display:none}}
.lvl{margin-left:4px;padding:2px 5px;font-family:var(--f-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
@media (max-width:520px){.lvl{display:none}.permit p{padding-right:0;padding-bottom:30px}.permit .pst{top:auto;bottom:8px;transform:rotate(-8deg)}@keyframes pstamp{from{opacity:0;transform:rotate(-8deg) scale(2.4)}}}
.card .haul{display:flex;flex-wrap:wrap;gap:8px 22px;margin:2px 0 12px}.card .haul span{display:flex;align-items:flex-end;gap:6px;font-size:var(--fs-3);font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;margin-top:14px;font-family:var(--f-display);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--label);background:var(--ink);border:3px solid #000;padding:12px;cursor:pointer;box-shadow:inset 3px 3px 0 rgba(255,255,255,.12),0 5px 0 #000}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.ui.is-title .stage{display:flex;flex-direction:column;align-items:center;gap:12px;overflow-x:hidden;overflow-y:auto;pointer-events:auto;scrollbar-width:none}
/* Title logo: the artwork split into three stacked layers, each with its own entrance */
.logo{position:relative;flex:none;width:min(500px,100%,62vh);margin:auto 0 0;pointer-events:none;filter:drop-shadow(0 5px 0 rgba(0,0,0,.65)) drop-shadow(0 0 20px rgba(0,0,0,.6))}
.logo::before{content:"";position:absolute;inset:-22% -9%;background:radial-gradient(closest-side,rgba(6,9,13,.78) 45%,rgba(6,9,13,0));animation:lgFade .5s .1s both}
@keyframes lgFade{from{opacity:0}}
.logo img{position:relative;display:block;width:100%;height:auto}
.logo .l2,.logo .l3{position:absolute;left:0;top:0}
.card.title{padding:18px 22px 22px}.card.title p{margin:0 0 8px}
.card.title .dock{position:sticky;bottom:0;z-index:1;margin:12px -22px -22px;padding:10px 22px 20px;background:var(--paper);border-top:2px dashed rgba(42,34,25,.35)}
.card.title .dock .pick{margin:0 0 7px}.card.title .btn{margin-top:12px}
@media (max-width:480px){.ui.is-title .stage{gap:10px}.logo{width:88%}.card.title{padding:14px 16px 16px}.card.title .dock{margin:10px -16px -16px;padding:8px 16px 14px}html[lang|="en"] .card.title{font-size:19px}.card.title .btn{margin-top:8px}}
.logo .l1{transform-origin:50% 21%;animation:lgDrop .55s cubic-bezier(.2,.8,.3,1.2) .1s both}
.logo .l2{animation:lgWipe .4s cubic-bezier(.6,0,.2,1) .5s both}
.logo .l3{transform-origin:50% 79%;animation:lgRise .5s cubic-bezier(.2,.8,.3,1.2) .7s both}
@keyframes lgDrop{0%{opacity:0;transform:translateY(-26%) scale(1.35)}55%{opacity:1}70%{transform:translateY(1.5%) scale(.97)}100%{transform:none}}
@keyframes lgWipe{from{clip-path:inset(0 50%)}to{clip-path:inset(0 0)}}
@keyframes lgRise{0%{opacity:0;transform:translateY(24%) scale(1.35)}55%{opacity:1}70%{transform:translateY(-1.5%) scale(.97)}100%{transform:none}}
.card.title{position:relative;left:auto;top:auto;transform:none;max-height:none;overflow:visible;flex:none;margin:0 0 auto;animation:cardInT .65s cubic-bezier(.2,.9,.25,1.15) 1s both}
@keyframes cardInT{from{opacity:0;transform:perspective(900px) rotateX(62deg) translateY(70px) scale(.92)}}
.flat{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;border:3px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,.6)}

/* Stamp bar */
.act{grid-area:act;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:6px}
.sbtn{display:grid;justify-items:center;gap:1px;padding:9px 8px 10px;border:3px solid #000;color:#fff;cursor:pointer;text-transform:uppercase;box-shadow:inset 3px 3px 0 rgba(255,255,255,.2),inset -3px -3px 0 rgba(0,0,0,.3),0 6px 0 #000;transition:transform .07s,box-shadow .07s,filter .2s}
.sbtn.g{background:var(--green)}.sbtn.r{background:var(--red)}
.sbtn .big{font-family:var(--f-display);font-size:clamp(16px,3.6vw,22px);letter-spacing:.08em}
.sbtn .sub{font-size:var(--fs-1);opacity:.85;text-transform:none}
.sbtn kbd{font-family:"VT323",monospace;font-size:15px;opacity:.65}
html[lang|="ru"] .sbtn kbd{font-family:var(--f-body);font-size:12px}
.sbtn:active:not(:disabled){transform:translateY(5px);box-shadow:inset 3px 3px 0 rgba(255,255,255,.2),0 1px 0 #000}
.sbtn:disabled{filter:grayscale(.75) brightness(.55);cursor:default}
@media (max-width:420px){.sbtn kbd{display:none}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fontwarm{position:fixed;left:-999px;top:0;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.night{transition:none}.permit .pst,.kv li.hint{animation:none}.logo img,.logo::before,.card.title{animation-duration:.01s!important;animation-delay:0s!important}.card,.caption.show,.flip.go,.rules li.new,.tins.pop,.vig.alarm,.fuse.low i{animation-duration:.01s;animation-iteration-count:1}}

/* Tins as currency: the milk counter becomes a button while you read; tea tip and toast; zakuska, bribe, parcel */
.hud{position:relative;z-index:4}
button.tins{appearance:none;margin:-4px -8px;padding:2px 6px;color:inherit;background:none;border:2px solid transparent;cursor:default}
button.tins:disabled{opacity:1}
button.tins.ready{cursor:pointer;background:var(--well);border-color:var(--amber);box-shadow:0 0 0 2px #000,0 0 12px rgba(233,178,74,.45);animation:teaGlow 1.6s steps(4) infinite}
button.tins.ready:hover{background:#151b22}
button.tins.ready:active{transform:translateY(2px)}
button.tins:focus-visible{outline:2px solid var(--frost);outline-offset:3px}
@keyframes teaGlow{50%{box-shadow:0 0 0 2px #000,0 0 3px rgba(233,178,74,.15)}}
.tip{position:absolute;top:calc(100% + 11px);left:0;z-index:5;width:max-content;max-width:min(300px,calc(100% - 8px));padding:8px 10px;font-size:var(--fs-1);line-height:1.25;color:var(--ink);background:var(--label);border:2px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.6);pointer-events:none;animation:tipIn .35s steps(3) both}
.tip::before{content:"";position:absolute;top:-10px;left:calc(var(--ax,50%) - 8px);border:8px solid transparent;border-top:0;border-bottom:9px solid #000}
.tip::after{content:"";position:absolute;top:-6px;left:calc(var(--ax,50%) - 5px);border:5px solid transparent;border-top:0;border-bottom:6px solid var(--label)}
@keyframes tipIn{from{opacity:0;transform:translateY(-6px)}}
.toast{position:absolute;top:10px;left:50%;z-index:3;width:max-content;max-width:calc(100% - 32px);padding:6px 12px;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:var(--amber);background:rgba(9,12,16,.9);border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.5);transform:translateX(-50%);pointer-events:none}
.toast.show{animation:toast 2.6s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}10%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.card .reward .teach{display:block;margin-top:5px;color:var(--ink)}
.card .reward.gone img{height:46px;opacity:.8}
.vk-btns.three #cBtn2{grid-column:2;grid-row:1}
.vk-btns .zak{grid-column:1/-1;grid-row:2;display:flex;align-items:center;justify-content:center;gap:12px;padding:9px 12px;background:var(--meat);text-align:left}
.vk-btns .zak img{display:block;height:34px;width:auto;flex:none;filter:drop-shadow(1px 1px 0 #000)}
.vk-btns .zak small{display:block;margin-top:2px;font-family:var(--f-body);font-size:var(--fs-1);letter-spacing:0;text-transform:none;opacity:.85}
@media (max-width:420px){.vk-btns.three #cBtn2,.vk-btns .zak{grid-column:auto;grid-row:auto}}
.card .bribe{display:flex;align-items:center;gap:12px;margin:2px 0 0;padding:8px 10px;border:2px solid var(--meat);background:rgba(138,24,50,.08)}
.card .bribe img{display:block;height:46px;width:auto;flex:none}
.card .bribe p{margin:0}
.btn.meat{background:var(--meat)}
.permit .queue{margin-top:6px}
.parcel{margin:4px 0 12px;padding:10px 12px;border:2px dashed var(--ink-soft);background:linear-gradient(rgba(195,154,87,.3),rgba(195,154,87,.3)),var(--label)}
.parcel .ph{display:block;margin-bottom:4px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.card .parcel .haul{margin:2px 0 8px}
.card .parcel .dim{margin:0 0 8px}
.parcel .reply{margin:0;padding:6px 10px;font-family:"VT323",monospace;font-size:20px;line-height:1.15;letter-spacing:.03em;background:#f4efdd;box-shadow:2px 2px 0 rgba(60,40,20,.2);transform:rotate(-.4deg)}
html[lang|="ru"] .parcel .reply{font-family:var(--f-body);font-size:15px;line-height:1.35}
@media (prefers-reduced-motion:reduce){button.tins.ready,.tip{animation:none}.toast.show{animation-duration:.01s}}

const ORIG=[
["Dr. Orlov. Director Volkov reports 34 ice cores against the quota of 40. Six remain. The Krasin will not wait for your excuses.","Доктор Орлов. Директор Волков сообщает: 34 керна льда при плане 40. Шесть остаются. «Красин» ваших оправданий ждать не будет."],
["Comrade Orlov, the Krasin is delayed at Dikson. Coal is rationed until it arrives. Your family in Leningrad is well; the Committee checked.","Товарищ Орлов, «Красин» задерживается в Диксоне. До его прихода уголь по норме. Ваша семья в Ленинграде здорова; Комитет проверил."],
["ARKTIKA-7 will observe radio silence outside the 0600 window. Director Volkov is responsible. You are responsible to Director Volkov.","АРКТИКА-7 соблюдает радиомолчание вне окна 06:00. Ответственный — директор Волков. Вы отвечаете перед директором Волковым."],
["The Party thanks you for the ice core from Severnaya Zemlya. It arrived intact, which is more than can be said for the last one. Continue.","Партия благодарит за керн с Северной Земли. Он прибыл целым, чего не скажешь о прошлом. Продолжайте."],
["Six staff at your station consume the food of eight. Explain, or the Committee will count for itself.","Шесть сотрудников вашей станции съедают паёк на восьмерых. Объясните, или Комитет сосчитает сам."],
["Dr. Orlov, you asked whether the sun will return. It will, on schedule. The Central Committee has confirmed this with the observatory.","Доктор Орлов, вы спросили, вернётся ли солнце. Вернётся, по графику. Центральный Комитет подтвердил это в обсерватории."],
["Your permafrost report is accepted with one correction: the boreholes are metres, not feet. Feet are for Americans.","Ваш отчёт по вечной мерзлоте принят с одной поправкой: скважины измеряются в метрах, а не в футах. Футы — для американцев."],
["Director Volkov has requested your transfer. Refused. He may learn to like you.","Директор Волков просил о вашем переводе. Отказано. Пусть научится вас терпеть."],
["Forty cores. Not thirty-nine. The Committee can count, and so can the Krasin's crew who carry them.","Сорок кернов. Не тридцать девять. Комитет умеет считать, как и экипаж «Красина», который их возит."],
["Comrade, the Krasin's captain saw a light on your station at night. Whose? Answer at 0600.","Товарищ, капитан «Красина» заметил свет на вашей станции ночью. Чей? Ответьте в 06:00."],
["Send fewer adjectives. The Politburo reads slowly in winter.","Присылайте меньше прилагательных. Зимой Политбюро читает медленно."],
["Dr. Orlov: warm regards from the Committee. It was decided you should hear this once. It will not be repeated.","Доктор Орлов: сердечный привет от Комитета. Решено, что вам стоит услышать это один раз. Повторено не будет."],
["We regret the coal delay. This regret is administrative and carries no obligation.","Мы сожалеем о задержке угля. Это сожаление административное и ни к чему не обязывает."],
["Your samples from Severnaya Zemlya are being studied at the AARI in Leningrad. Do not ask by whom.","Ваши образцы с Северной Земли изучаются в ААНИИ в Ленинграде. Не спрашивайте кем."]];

["ARKTIKA-9 will observe radio silence outside the 0600 window. Director Volkov is responsible. You are responsible to Director Volkov.","АРКТИКА-9 соблюдает радиомолчание вне окна 06:00. Ответственный — директор Волков. Вы отвечаете перед директором Волковым."],
["The Party thanks you for the ice core from Novaya Zemlya. It arrived intact, which is more than can be said for the last one. Continue.","Партия благодарит за керн с Новой Земли. Он прибыл целым, чего не скажешь о прошлом. Продолжайте."],

["Comrade Orlov, your team of eight scientists will receive extra rations by decree. Do not waste them.","Товарищ Орлов, ваша группа из восьми учёных получит дополнительный паёк по постановлению. Не тратьте его впустую."],
["Radio contact will resume at 1800. Director Volkov will confirm. The Politburo trusts you, for now.","Радиосвязь возобновится в 18:00. Подтвердит директор Волков. Политбюро вам доверяет — пока."],
["Your Antarctic ice-core programme is progressing. The Party expects progress in accordance with the plan for progress.","Ваша программа изучения антарктических льдов идёт успешно. Партия ожидает прогресса в соответствии с планом прогресса."],
["Dr. Orlov, your samples will be forwarded to the Kremlin Council of Sciences. Do not ask by whom.","Доктор Орлов, ваши образцы будут переданы в Кремлёвский совет наук. Не спрашивайте кем."],
["Dr. Ivanov, the Krasin arrives Friday with coal. Comrade Volkov sends his greetings. Continue your work.","Доктор Иванов, «Красин» прибудет в пятницу с углём. Товарищ Волков передаёт привет. Продолжайте работу."],
["Comrade Orlov, the polar night is a test. The test is a test. Director Volkov will test you.","Товарищ Орлов, полярная ночь — испытание. Испытание — это испытание. Директор Волков вас испытает."],
["Dr. Orlov, coal has been reduced. A reduction of coal is a reduction. Report by 0600 as usual.","Доктор Орлов, уголь сокращён. Сокращение угля есть сокращение. Доклад к 06:00, как обычно."],
["The Politburo commends ARKTIKA-7 on Wrangel Island. Forty cores per month is what the Party requires.","Политбюро отмечает АРКТИКУ-7 на острове Врангеля. Сорок кернов в месяц — вот чего требует Партия."],
["Comrade Orlov, your wife writes from Moscow that she is well. The Committee checked. Continue.","Товарищ Орлов, жена пишет из Москвы, что здорова. Комитет проверил. Продолжайте."],
["Dr. Orlov, the Krasin's crew of thirty send regards. Director Volkov reports the station has ten staff. Explain.","Доктор Орлов, экипаж «Красина» из тридцати человек шлёт привет. Директор Волков сообщает, что на станции десять сотрудников. Объясните."],
["Comrade, the sun returns in March. Or so the Committee is told. The Committee is told many things, Comrade Orlov.","Товарищ, солнце вернётся в марте. Так сообщили Комитету. Комитету сообщают многое, товарищ Орлов."]];

// ---------- telegram blank, stamp imprint, calendar, poster ----------
let lang='en';

const PAPER={c:document.createElement('canvas'),b:document.createElement('canvas'),msg:null,frac:0,stamp:null,lines:[],font:null};

const ser=s=>lang==='ru'?s.replace('ARK','АРК').replace('ARC','АРС'):s;

// fill {date+N}, {wd+N} (weekday) and {wds+N} ("on Mondays") with the in-game date
function fill(s){return s.replace(/\{(date|wds|wd)([+-]\d+)\}/g,(_,k,n)=>{const d=dayDate(+n),dd=d.getDate(),w=d.getDay();
  if(k==='date')return lang==='ru'?`${dd} декабря`:`${dd} December`;

  return lang==='ru'?WD_DAT[w]:TXT.en.wd[w]+'s'}).replace(/\{(milk|meat)(X?)\}/g,(_,k,x)=>tinsN(shelfCnt[k+x]))}
// {milk} and {meat} are this morning's shelf; {milkX} and {meatX} are the parrot's wrong guess

const tinsN=n=>lang==='ru'?`${n} ${ruPl(n,'банка','банки','банок')}`:`${n} tin${n===1?'':'s'}`;

function spaced(x,s,X,Y,sp,al){const ch=[...s],ws=ch.map(c=>x.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
  let cx=al==='c'?X-tot/2:al==='r'?X-tot:X;const ta=x.textAlign;x.textAlign='left';ch.forEach((c,i)=>{x.fillText(c,cx,Y);cx+=ws[i]+sp});x.textAlign=ta;return tot}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function layoutText(x,txt,maxW){const out=[];let cur='';for(const w of txt.split(/\s+/)){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}if(cur)out.push(cur);return out}

function buildBase(){
  const m=PAPER.msg;if(!m)return;

  x.strokeStyle='rgba(90,70,40,.1)';x.lineWidth=1;for(let i=0;i<70;i++){x.beginPath();const X=r()*CW,Y=r()*CH;x.moveTo(X,Y);x.lineTo(X+(r()-.5)*40,Y+(r()-.5)*12);x.stroke()}
  const g=x.createRadialGradient(CW/2,CH/2,CH*.35,CW/2,CH/2,CW*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(90,60,20,.28)');x.fillStyle=g;x.fillRect(0,0,CW,CH);

  x.fillStyle=ink;x.font=`${Math.round(F.small*1.35)}px ${F.body}`;x.textAlign='center';x.fillText(ser(m.s),bx+bw/2+14,by+bh-18);x.textAlign='left';

    x.font=`${F.small}px ${F.body}`;x.fillStyle=ink;x.fillText(p[1],vx,p[2]);x.fillStyle='rgba(43,34,25,.3)';x.fillRect(vx-6,p[2]+8,bx-vx-14,2)});
  const words=msgText(m).split(/\s+/).length;
  x.font=`17px ${DISP}`;x.fillStyle='rgba(43,34,25,.65)';x.textAlign='right';const rd=dayDate(0),rds=`${String(rd.getDate()).padStart(2,'0')}.12.78`;x.fillText(`${u.words} ${words}   ·   ${u.recv} ${rds} ${lang==='ru'?'06:00':'0600'}`,CW-M,by+bh+30);x.textAlign='left';
  x.fillStyle='rgba(43,34,25,.45)';x.fillRect(M,316,CW-2*M,2);

    x.save();x.translate(x0,yTop);x.rotate(rot);x.fillStyle='rgba(60,40,20,.18)';x.fillRect(-13,3,w+30,sh);x.fillStyle='#f4efdd';x.fillRect(-16,0,w+30,sh);x.restore();
    return{t,x:x0,y:yTop,rot,sh}});

  let off=0;x.font=`${size}px ${F.body}`;PAPER.lines.forEach(L=>{L.off=off;off+=L.t.length+1;let acc=0;L.cum=[0];for(const ch of L.t){acc+=x.measureText(ch).width;L.cum.push(acc)}});

let lastTex=0;
function drawPaper(force){
  const m=PAPER.msg;if(!m||!PAPER.font)return;
  const x=PAPER.c.getContext('2d'),F=PAPER.font;
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.drawImage(PAPER.b,0,0);
  let n=Math.round(PAPER.lines.reduce((a,l)=>a+l.t.length,0)*PAPER.frac);
  const r=mulberry32(m.seed^0x5eed);
  x.font=`${F.size}px ${F.body}`;x.textBaseline='middle';x.textAlign='left';
  for(const l of PAPER.lines){if(n<=0)break;const s=l.t.slice(0,n);n-=l.t.length;
    x.save();x.translate(l.x,l.y);x.rotate(l.rot);let cx=0;
    for(const ch of s){x.fillStyle=`rgba(31,26,20,${.78+r()*.22})`;x.fillText(ch,cx,l.sh/2+(r()-.5)*2.4);cx+=x.measureText(ch).width}
    x.restore()}
  if(PAPER.marks&&PAPER.markFrac>0)drawMarks(x,m,F);
  if(PAPER.stamp)drawStamp(x,PAPER.stamp);
  if(W.paperTex){const t=now();if(force||t-lastTex>55){W.paperTex.needsUpdate=true;lastTex=t}}
}

// a colleague's pencil: wavy graphite underlines that grow in reading order, then a note in the service-marks line
function drawMarks(x,m,F){const r=mulberry32(m.seed^0x51c);let budget=PAPER.marks.reduce((a,s)=>a+s[1]-s[0],0)*PAPER.markFrac;
  x.save();x.lineCap='round';x.lineJoin='round';
  for(const [s0,s1] of PAPER.marks){if(budget<=0)break;const e=s0+Math.min(s1-s0,budget);budget-=s1-s0;
    for(const L of PAPER.lines){const a=Math.max(s0,L.off),b=Math.min(e,L.off+L.t.length);if(a>=b)continue;
      const x0=L.cum[a-L.off]-3,x1=L.cum[b-L.off]+3,y=L.sh*.93;
      x.save();x.translate(L.x,L.y);x.rotate(L.rot);
      for(let pass=0;pass<2;pass++){x.strokeStyle=pass?'rgba(96,98,110,.45)':'rgba(56,58,68,.82)';x.lineWidth=pass?2:Math.max(3,F.size*.055);x.beginPath();
        let first=true;for(let X=x0;X<x1;X+=7){const yy=y+Math.sin(X*.08+s0)*1.4+(r()-.5)*1.2+pass*2.4;if(first){x.moveTo(X,yy);first=false}else x.lineTo(X,yy)}

  if(PAPER.markFrac>=1){x.translate(CW-60,CH-52);x.rotate(-.025);x.font=`${Math.round(FONTS[lang].small*1.05)}px ${F.body}`;x.textAlign='right';x.textBaseline='alphabetic';x.fillStyle='rgba(56,58,68,.78)';x.fillText(TXT[lang].pencilNote,0,0)}
  x.restore()}

  await tween(650,e=>{A.position.lerpVectors(a0,a1,e);B.position.lerpVectors(b0,b1,e);A.rotation.z=-.12*e;B.rotation.z=.12*e});
  S.glass();shakeA=.004;
  await tween(160,e=>{const k=Math.sin(e*Math.PI)*.005;A.position.x=a1.x+k;B.position.x=b1.x-k});
  await tween(650,e=>{A.rotation.x=B.rotation.x=1.15*e;A.position.y=a1.y+.06*e;B.position.y=b1.y+.06*e;A.userData.liq.scale.y=B.userData.liq.scale.y=Math.max(.02,1-e)});
  A.userData.liq.visible=B.userData.liq.visible=false;W.vodkaLiq.scale.y=.3;W.vodkaLiq.position.y=.087-.17*.35;
  const a2=a1.clone().setY(a1.y+.06),b2=b1.clone().setY(b1.y+.06);
  await tween(500,e=>{A.rotation.x=B.rotation.x=1.15*(1-e);A.position.lerpVectors(a2,a0,e);B.position.lerpVectors(b2,b0,e)});
  A.rotation.set(0,0,0);B.rotation.set(0,0,0)}
async function takeVodka(){if(!has3D)return;const items=[W.bottle,W.glassA,W.glassB],p0=items.map(o=>o.position.clone());
  await tween(850,e=>{items.forEach((o,i)=>o.position.set(p0[i].x-.6*e,p0[i].y+.06*Math.sin(Math.PI*e),p0[i].z+.16*e))},EASE.i);W.vodka.visible=false}
// the morning after: the bottle empty on its side, one glass knocked over
function morningVodka(){if(!has3D)return;resetVodka();W.vodka.visible=true;W.vodkaLiq.visible=false;[W.glassA,W.glassB].forEach(g=>g.userData.liq.visible=false);
  W.bottle.rotation.set(0,0,Math.PI/2);W.bottle.position.set(-.04,WIN.y0+.034,-.575);
  W.glassA.rotation.set(0,0,Math.PI/2);W.glassA.position.set(.12,WIN.y0+.032,-.55)}
function hideVodka(){if(!has3D)return;W.vodka.visible=false;if(W.zak){scene.remove(W.zak);W.zak=null}}

async function nightFade(a,b){const n=$('night');$('nightA').textContent=a;$('nightB').textContent=b;n.hidden=false;void n.offsetWidth;n.classList.add('on');await wait(2700)}
function unNight(){const n=$('night');if(n.hidden)return;n.classList.remove('on');setTimeout(()=>{if(!n.classList.contains('on'))n.hidden=true},1000)}
function clearHang(){hangAmp=0;$('gl').style.filter='';const f=$('files');f.style.filter='';f.style.setProperty('--hang','0');$('glare').hidden=true;if(has3D)W.ghost.visible=false}

// the hangover: strongest when the telegram arrives, easing as the fuse burns, gone once you stamp
// stewed meat with the vodka (zakuska) keeps the morning milder: less blur and glare, no double vision
const zakuska=()=>!!(volkov&&volkov.zak);
function hangFrame(t,dt){const want=hungover()?(phase==='intro'?1:phase==='decide'?.15+.85*clamp(tLeft/tTotal,0,1):0)*(zakuska()?.42:1):0;
  if(!want&&!hangAmp)return;
  hangAmp+=(want-hangAmp)*Math.min(1,dt*.0025);if(!want&&hangAmp<.004){clearHang();return}
  const A=hangAmp,ts=t/1000,wave=RM?.55:Math.pow(.5+.5*Math.sin(ts*1.25),2),b=A*2.6*wave,f=$('files');
  $('gl').style.filter=b>.05?`blur(${b.toFixed(2)}px)`:'';f.style.filter=b>.12?`blur(${(b*.38).toFixed(2)}px)`:'';f.style.setProperty('--hang',A.toFixed(3));
  if(has3D){if(!_hv)_hv=new THREE.Vector3();
    const gl=$('glare'),v=W.bulb.getWorldPosition(_hv).project(cam);gl.hidden=false;
    gl.style.setProperty('--gx',((v.x*.5+.5)*100).toFixed(1)+'%');gl.style.setProperty('--gy',((-v.y*.5+.5)*100).toFixed(1)+'%');gl.style.opacity=(A*(.55+.2*Math.sin(ts*2.1))).toFixed(3);
    const G=W.ghost;if(A>.01&&W.paper.visible&&!zakuska()){G.visible=true;G.material.opacity=.42*Math.min(1,A*1.3);G.position.copy(W.paper.position);G.quaternion.copy(W.paper.quaternion);
      G.position.x+=(RM?.006:Math.sin(ts*.9)*.0095)*A;G.position.z+=(RM?.002:Math.sin(ts*.63+1)*.005)*A;G.position.y+=.0009}else G.visible=false}
  if(A>.3&&phase==='decide'&&t-lastThump>1150){lastThump=t;S.thump()}}

S.glass=function(){if(!this.ok())return;const t=this.ctx.currentTime;this.tn(t,2350,0,.7,'sine',.16);this.tn(t,3520,0,.5,'sine',.07);this.tn(t+.004,4700,0,.25,'sine',.04)};
S.thump=function(){if(!this.ok())return;const t=this.ctx.currentTime;this.tn(t,62,38,.16,'sine',.55);this.tn(t+.17,58,36,.14,'sine',.35)};

function rulesFor(d){d=Math.max(1,d);const L=lvl();if(L==='easy')return 5;if(L==='hard'&&d>=10)return 7;return Math.min(5,2+Math.floor((d-1)/2))}
function mk(p){const n=String(100+(Math.random()*800|0));let s=n+'/ARK',bad=false;
  if(!p.real&&Math.random()<SLIP[lvl()]){s=pick([n+'-ARK',n+'/ARC',n.slice(1)+'/ARK',n+' ARK']);bad=true}
  return{m:p.m,real:p.real,tier:p.tier,tell:p.tell||null,why:p.why||null,from:p.from||null,to:p.to||null,shelf:p.shelf||0,src:p,s,bad,seed:(Math.random()*1e9)|0}}
function buildQueue(){const used=new Set();
  const take=(tiers,real,n)=>{const out=[];for(const p of shuffle(POOL.filter(p=>tiers.includes(p.tier)&&p.real===real))){if(out.length>=n)break;if(p.pair&&used.has(p.pair))continue;out.push(p);if(p.pair)used.add(p.pair)}return out};
  const seg=(tiers,r,f)=>{let R,P;if(Math.random()<.5){R=take(tiers,1,r);P=take(tiers,0,f)}else{P=take(tiers,0,f);R=take(tiers,1,r)}return shuffle([...R,...P])};
  const L=lvl();let q;
  if(L==='easy'){const r=Math.random()<.5?3:4;q=seg([1],r,DAYS-r)}
  else if(L==='medium')q=seg([1,2],5,5);
  else{const r2=Math.random()<.5?2:3;q=[...seg([1],2,2),...seg([2],r2,5-r2),...seg([3],5-r2,r2)]}
  return q.map(mk)}

$('snd').onclick=()=>{S.init();S.set(!S.on);try{localStorage.setItem('pp_snd',S.on?'1':'0')}catch(e){}renderStatic()};
$('tabD').onclick=()=>tab('D');$('tabR').onclick=()=>tab('R');
$('card').addEventListener('keydown',e=>{const t=e.target;if(!t.classList||!t.classList.contains('shift'))return;let i=SHIFTS.indexOf(DAYS);
  if(e.key==='ArrowRight'||e.key==='ArrowDown')i=(i+1)%SHIFTS.length;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')i=(i+SHIFTS.length-1)%SHIFTS.length;else return;
  e.preventDefault();e.stopPropagation();setShift(SHIFTS[i])});
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(phase==='decide'&&e.code==='KeyT'){e.preventDefault();useTea();return}
  if(phase==='decide'){if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();S.init();decide(1)}else if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();S.init();decide(0)}}
  else if(phase==='intro'&&(e.key===' '||e.key==='Enter')){e.preventDefault();hurry()}
  else if(phase==='evening'&&vkTalking()&&(e.key===' '||e.key==='Enter'||e.key==='Escape')){e.preventDefault();vkSkip()}});
addEventListener('resize',()=>{layout();placeTip()});
if(window.ResizeObserver)new ResizeObserver(()=>layout()).observe($('stage'));

// ---------- boot ----------
function start(data){data=data||{};
  try{lang=data.lang||localStorage.getItem('pp_lang')||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en')}catch(e){lang='en'}
  let snd=null;try{snd=localStorage.getItem('pp_snd')}catch(e){}
  if(typeof data.muted==='boolean')S.on=!data.muted;else if(snd!==null)S.on=snd==='1';
  if(data.bests)for(const d of SHIFTS)bests[d]=+data.bests[d]||0;if(SHIFTS.includes(data.days))DAYS=data.days;
  initTins();
  if(has3D){try{buildWorld();W.curT=new THREE.Vector3()}catch(e){console.error(e);has3D=false;$('gl').innerHTML=''}}
  if(has3D){
    const ray=new THREE.Raycaster(),nd=new THREE.Vector2(),hitStamp=()=>{ray.setFromCamera(nd,cam);const h=ray.intersectObjects([W.stA,W.stP],true)[0];let o=h&&h.object;while(o&&!o.userData.kind)o=o.parent;return o};
    R.domElement.addEventListener('pointerdown',e=>{if(phase==='intro'){hurry();return}if(phase!=='decide')return;nd.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);const o=hitStamp();if(o){S.init();decide(o.userData.kind==='A'?1:0)}});
    addEventListener('pointermove',e=>{par.tx=e.clientX/innerWidth*2-1;par.ty=-(e.clientY/innerHeight*2-1);
      if(phase==='decide'&&e.target===R.domElement){nd.set(par.tx,par.ty);R.domElement.style.cursor=hitStamp()?'pointer':''}});
  }else{PAPER.c.className='flat';$('stage').prepend(PAPER.c)}
  $('icoM').src=ICON.milkS;$('icoS').src=ICON.meatS;
  renderStatic();renderHud();setTimerUI();
  if(has3D){layout();drawCal(0,0);drawPoster();const p=shotPose('title',now());cam.position.copy(p.p);W.curT.copy(p.t);cam.lookAt(p.t)}
  toTitle();
  if(document.fonts){document.fonts.ready.then(()=>Promise.all(['22px "Russo One"','40px "VT323"','40px "Underdog"'].map(f=>document.fonts.load(f,'АБВ abc 123').catch(()=>{})))).then(refreshCanvases);
    if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',refreshCanvases)}
  requestAnimationFrame(loop);
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({lang,muted:!S.on,bests:{...bests},days:DAYS}))}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body></html>
