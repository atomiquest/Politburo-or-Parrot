<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politburo or Parrot</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1f1a;--panel:#2b3128;--paper:#e8dcb5;--ink:#2a2418;--red:#b3261e;--grn:#3f7d3a;--dim:#8a9580;--hi:#e8dcb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--hi);font-family:'VT323','Courier New',monospace;font-size:20px;line-height:1.15;image-rendering:pixelated}
#app{max-width:640px;margin:0 auto;padding:10px}
.bar{display:flex;justify-content:space-between;background:var(--panel);border:4px solid #000;box-shadow:inset -4px -4px 0 #171b15,inset 4px 4px 0 #3d4638;padding:8px 12px;font-size:22px}
.bar b{color:var(--red)}
.box{background:var(--panel);border:4px solid #000;box-shadow:inset -4px -4px 0 #171b15,inset 4px 4px 0 #3d4638;padding:12px;margin-top:10px}
.paper{background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:14px;margin-top:12px;position:relative;min-height:230px;font-size:22px}
.paper h3{margin:0 0 8px;font-weight:normal;font-size:18px;border-bottom:3px double var(--ink);padding-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.paper .t{white-space:pre-wrap}
.stamp{position:absolute;right:10px;bottom:10px;border:5px solid;padding:2px 10px;font-size:34px;transform:rotate(-12deg);opacity:0;pointer-events:none}
.stamp.on{opacity:.9;animation:st .25s steps(3)}
@keyframes st{from{transform:rotate(-12deg) scale(2.2)}to{transform:rotate(-12deg) scale(1)}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;font-size:22px;padding:12px 6px;border:4px solid #000;cursor:pointer;color:#fff;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.25)}
button:active{transform:translate(2px,2px)}
button:disabled{opacity:.4}
.g{background:var(--grn)}.r{background:var(--red)}.n{background:#555;width:100%}
ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}
.dim{color:var(--dim)}
.big{font-size:30px;color:var(--red)}
h2{margin:0 0 6px;font-weight:normal;font-size:28px}
.snow{height:8px;background:repeating-linear-gradient(90deg,#dfe8ec 0 8px,transparent 8px 20px);opacity:.5;margin-top:8px}
.tm{height:14px;border:3px solid #000;background:#171b15;margin-top:10px}.tm i{display:block;height:100%;background:var(--grn);width:100%}
.seal{position:absolute;left:12px;bottom:12px;width:64px;height:64px;border:5px solid;display:flex;align-items:center;justify-content:center;font-size:38px;border-radius:50%;opacity:.85;transform:rotate(8deg)}
.dos{background:#2f3524}.dos li{color:#ffd35a}
</style></head><body><div id="app"></div>
<script>
const ORIG=[
"Dr. Orlov. Director Volkov reports 34 ice cores against the quota of 40. Six remain. The Krasin will not wait for your excuses.",
"Comrade Orlov, the Krasin is delayed at Dikson. Coal is rationed until it arrives. Your family in Leningrad is well; the Committee checked.",
"ARKTIKA-7 will observe radio silence outside the 0600 window. Director Volkov is responsible. You are responsible to Director Volkov.",
"The Party thanks you for the ice core from Severnaya Zemlya. It arrived intact, which is more than can be said for the last one. Continue.",
"Six staff at your station consume the food of eight. Explain, or the Committee will count for itself.",
"Dr. Orlov, you asked whether the sun will return. It will, on schedule. The Central Committee has confirmed this with the observatory.",
"Your permafrost report is accepted with one correction: the boreholes are metres, not feet. Feet are for Americans.",
"Director Volkov has requested your transfer. Refused. He may learn to like you.",
"Forty cores. Not thirty-nine. The Committee can count, and so can the Krasin's crew who carry them.",
"Comrade, the Krasin's captain saw a light on your station at night. Whose? Answer at 0600.",
"Send fewer adjectives. The Politburo reads slowly in winter.",
"Dr. Orlov: warm regards from the Committee. It was decided you should hear this once. It will not be repeated.",
"We regret the coal delay. This regret is administrative and carries no obligation.",
"Your samples from Severnaya Zemlya are being studied in Moscow. Do not ask by whom."];
const BOT=[
"Dr. Orlov. Director Petrov reports 34 ice cores against the quota of 40. Six remain. The Krasin will not wait for your excuses.",
"Comrade Orlov, the icebreaker Sibiryakov is delayed at Dikson. Coal is rationed until it arrives. The Committee regrets nothing.",
"ARKTIKA-9 will observe radio silence outside the 0600 window. Director Volkov is responsible. You are responsible to Director Volkov.",
"The Party thanks you for the ice core from Novaya Zemlya. It arrived intact, which is more than can be said for the last one. Continue.",
"Dr. Orlov, the quota of 45 cores must be met. The Krasin departs soon. The Committee is watching.",
"Comrade Orlov, your team of eight scientists will receive extra rations by decree. Do not waste them.",
"Radio contact will resume at 1800. Director Volkov will confirm. The Politburo trusts you, for now.",
"Your Antarctic ice-core programme is progressing. The Party expects progress in accordance with the plan for progress.",
"Dr. Orlov, your samples will be forwarded to the Kremlin Council of Sciences. Do not ask by whom.",
"Dr. Ivanov, the Krasin arrives Friday with coal. Comrade Volkov sends his greetings. Continue your work.",
"Comrade Orlov, the polar night is a test. The test is a test. Director Volkov will test you.",
"Dr. Orlov, coal has been reduced. A reduction of coal is a reduction. Report by 0600 as usual.",
"The Politburo commends ARKTIKA-7 on Wrangel Island. Forty cores per month is what the Party requires.",
"Comrade Orlov, your wife writes from Moscow that she is well. The Committee checked. Continue.",
"Dr. Orlov, the Krasin's crew of thirty send regards. Director Volkov reports the station has ten staff. Explain.",
"Comrade, the sun returns in March. Or so the Committee is told. The Committee is told many things, Comrade Orlov."];
const RULES=[
"The parrot copies the Politburo's tone perfectly. Tone proves nothing. Facts do.",
"Check every name, place, number and time against the DOSSIER.",
"Real serials read NNN/ARK. A wrong serial = parrot. A right one proves nothing.",
"The parrot has never been here. It knows the words, not the place.",
"Beware empty loops: sentences that repeat themselves and say nothing."];
const CITY=["Kolyma","Vorkuta","Norilsk","Magadan","Yakutsk"];
const DAYS=10;
const $=id=>document.getElementById(id);
let day,queue,cur,done,tw;
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const pad=n=>String(n).padStart(3,"0");
const pick=a=>a[Math.floor(Math.random()*a.length)];
let T,left,tk,to;
function mk(text,real){
 const n=pad(100+Math.floor(Math.random()*800));
 let s=n+"/ARK";
 if(!real&&Math.random()<.3)s=sh([n+"-ARK",n+"/ARC",n.slice(1)+"/ARK",n+" ARK"])[0];
 return{text,real,s};}
function start(){
 day=0;
 const r=sh(ORIG).slice(0,5).map(t=>mk(t,1)),b=sh(BOT).slice(0,5).map(t=>mk(t,0));
 queue=sh([...r,...b]);
 next();}
function frame(inner){$("app").innerHTML=`<div class="bar"><span>DAY ${day} / ${DAYS}</span><span>STATION <b>ARKTIKA-7</b></span></div>${inner}<div class="snow"></div>`;}
function next(){
 if(day>=DAYS)return win();
 day++;cur=queue[day-1];done=false;to=false;
 const rules=RULES.slice(0,Math.min(RULES.length,2+Math.floor((day-1)/2))).map(r=>`<li>${r}</li>`).join("");
 T=Math.max(22,46-day*2);left=T;
 frame(`<div class="box"><b>RULEBOOK</b> <span class="dim">(updated daily)</span><ul>${rules}</ul></div>
 <div class="box dos"><b>DOSSIER</b><ul><li>Station: ARKTIKA-7, Severnaya Zemlya</li><li>You: Dr. Orlov (family in Leningrad)</li><li>Director: Volkov · Staff: 6</li><li>Quota: 40 ice cores / month</li><li>Icebreaker: Krasin · Radio window: 0600</li></ul></div>
 <div class="tm"><i id="tb"></i></div>
 <div class="paper"><h3><span>TELEGRAM</span><span>No. ${cur.s}</span></h3><div class="t" id="t"></div>
 <div class="stamp" id="st"></div></div>
 <div class="btns"><button class="g" onclick="ans(1)">AUTHENTIC<br>POLITBURO</button><button class="r" onclick="ans(0)">AMERICAN<br>PARROT</button></div>`);
 const el=$("t");let i=0;clearInterval(tw);
 tw=setInterval(()=>{el.textContent=cur.text.slice(0,++i);if(i>=cur.text.length)clearInterval(tw)},18);
 clearInterval(tk);
 tk=setInterval(()=>{left-=.1;const b=$("tb");if(b){b.style.width=Math.max(0,left/T*100)+"%";b.style.background=left<T*.3?"#b3261e":"#3f7d3a"}if(left<=0)ans(-1)},100);}
function ans(g){
 if(done)return;done=true;clearInterval(tw);clearInterval(tk);$("t").textContent=cur.text;
 document.querySelectorAll(".btns button").forEach(b=>b.disabled=true);
 to=g==-1;
 const ok=!to&&(g==1)==!!cur.real,st=$("st");
 st.textContent=to?"TOO SLOW":g?"FILED":"DENOUNCED";st.style.color=g==1?"#3f7d3a":"#b3261e";st.classList.add("on");
 setTimeout(()=>ok?good():bad(),900);}
function good(){
 const why=cur.real?"the real Politburo":"the American parrot";
 frame(`<div class="box"><h2>CORRECT.</h2><p>It was ${why}. The commissar nods. One tin of condensed milk added to your ration.</p><button class="n" onclick="next()">${day>=DAYS?"CONTINUE":"NEXT DAY"}</button></div>`);}
function bad(){
 const y=10+Math.floor(Math.random()*11),c=pick(CITY);
 const why=to?"You hesitated. The Commissar calls it sabotage.":cur.real?"It was the real Politburo. You denounced the Party.":"It was the American parrot. You served the enemy.";
 frame(`<div class="box"><div class="big">WRONG.</div><p>${why}</p><p>Verdict: <b style="color:var(--red)">${y} YEARS</b> hard labour in ${c}.</p><p class="dim">You survived ${day-1} day${day==2?"":"s"} at the station.</p><button class="n" onclick="start()">SERVE AGAIN</button></div>`);}
function win(){
 frame(`<div class="box"><h2>RELEASED.</h2><p>${DAYS} days without error. A plane arrives from Moscow. You are transferred south, watched, but free.</p><p class="dim">Perhaps the parrot is learning too.</p><button class="n" onclick="start()">NEW POSTING</button></div>`);}
start();
</script></body></html>
